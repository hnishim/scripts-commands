name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell and Python syntax
        run: bash tests/ci_test.sh

  applescript-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run two-pane Finder fixture tests
        run: osascript tests/two-panes-finder_test.applescript

  notion-link-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test Notion link behavior (no credentials or GUI)
        run: node --experimental-strip-types --test raycast-notion-link/tests/*.test.mjs
