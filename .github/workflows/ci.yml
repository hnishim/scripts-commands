name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell and Python syntax
        run: bash tests/ci_test.sh

  applescript-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run two-pane Finder fixture tests
        run: osascript tests/two-panes-finder_test.applescript
  
  notion-current-page-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test open-page Script Command and Swift link formatting
        run: python3 -m unittest discover -s tests -p 'test_notion_current_page.py' -v
